name: Windows x64 helper preview release

on:
  push:
    tags:
      - "windows-preview-v*"

permissions:
  contents: read

concurrency:
  group: windows-preview-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  authorize:
    name: Authorize exact Windows preview source
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    outputs:
      commit: ${{ steps.contract.outputs.commit }}
      tag: ${{ steps.contract.outputs.tag }}
      version: ${{ steps.contract.outputs.version }}
    steps:
      - name: Check out the exact tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.17.0"
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Verify pinned native tool provenance
        run: npm run verify:upstream-tool-provenance

      - name: Authorize exact annotated tag and quality-approved main source
        id: contract
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_TYPE" = "tag"
          tag="$GITHUB_REF_NAME"
          version="$(node -p "require('./package.json').version")"
          test "$tag" = "windows-preview-v$version"
          tag_ref_json="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag")"
          test "$(jq -r '.object.type' <<<"$tag_ref_json")" = tag
          tag_object_sha="$(jq -r '.object.sha' <<<"$tag_ref_json")"
          test -n "$tag_object_sha"
          test "$tag_object_sha" != null
          tag_object_json="$(gh api \
            "repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha")"
          test "$(jq -r '.tag' <<<"$tag_object_json")" = "$tag"
          test "$(jq -r '.object.type' <<<"$tag_object_json")" = commit
          jq -er \
            '.message | split("\n") | index("Release-Confirmation: PUBLISH_WINDOWS_PREVIEW") != null' \
            <<<"$tag_object_json" >/dev/null
          commit="$(jq -r '.object.sha' <<<"$tag_object_json")"
          test "$commit" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          test "$(git rev-parse refs/remotes/origin/main)" = "$commit"
          quality_json="$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/typescript-quality.yml/runs" \
            -f branch=main \
            -f event=push \
            -f head_sha="$commit" \
            -f per_page=100)"
          quality_successes="$(jq --arg commit "$commit" --arg repository "$GITHUB_REPOSITORY" \
            '[.workflow_runs[] | select(
              .head_sha == $commit
              and .head_branch == "main"
              and .event == "push"
              and .status == "completed"
              and .conclusion == "success"
              and .head_repository.full_name == $repository
            )] | length' <<<"$quality_json")"
          test "$quality_successes" -ge 1
          printf 'commit=%s\ntag=%s\nversion=%s\n' \
            "$commit" "$tag" "$version" >> "$GITHUB_OUTPUT"

  publish:
    name: Build, install-test, attest, and publish Windows x64 helper preview
    needs: authorize
    runs-on: windows-2025
    timeout-minutes: 70
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out the exact tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.17.0"
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Materialize the pinned Electron runtime
        run: node node_modules/electron/install.js

      - name: Install matching Chrome and ChromeDriver
        id: setup-chrome
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Typecheck and build the unsigned Windows helper installer
        run: npm run typecheck && npm run desktop:icons:check && npm run package:desktop:installer

      - name: Prove Job Object lifetime and descendant cleanup
        run: npm run test:windows:job-launcher

      - name: Prove packaged helper liveness and semantic VOD flow
        run: npm run test:package:desktop && npm run test:semantic:engine

      - name: Install, prove HKCU autostart and browser loopback, then uninstall
        run: npm run test:package:desktop:installer
        env:
          CHROMIUM_BINARY: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROMEDRIVER_BINARY: ${{ steps.setup-chrome.outputs.chromedriver-path }}
          KIRINUKI_INSTALLED_BROWSER_SMOKE: "1"
          KIRINUKI_INSTALLER_SYSTEM_SMOKE: "1"

      - name: Prove the preview input has no Authenticode signature
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:GITHUB_WORKSPACE 'dist/installers/win32-x64/UNSIGNED-TEST-ONLY-Kirinuki-Engine-windows-x64-setup.exe'
          $signature = Get-AuthenticodeSignature -LiteralPath $path
          if ($signature.Status.ToString() -cne 'NotSigned') {
            throw "unexpected Authenticode state: $($signature.Status)"
          }

      - name: Assemble the explicitly unsigned Windows helper preview
        run: npm run package:desktop:windows-preview
        env:
          KIRINUKI_WINDOWS_PREVIEW_COMMIT: ${{ needs.authorize.outputs.commit }}
          KIRINUKI_WINDOWS_PREVIEW_TAG: ${{ needs.authorize.outputs.tag }}

      - name: Prove packaging kept tracked source clean
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code -- web

      - name: Attest every Windows preview release asset
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: dist/windows-preview/*

      - name: Create GitHub prerelease, read back exact bytes, and publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KIRINUKI_WINDOWS_PREVIEW_COMMIT: ${{ needs.authorize.outputs.commit }}
          KIRINUKI_WINDOWS_PREVIEW_TAG: ${{ needs.authorize.outputs.tag }}
        run: |
          set -euo pipefail
          tag="$KIRINUKI_WINDOWS_PREVIEW_TAG"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release already exists: $tag" >&2
            exit 1
          fi
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --prerelease \
            --title "Kirinuki 영상 준비 도우미 $tag · Windows x64 Preview" \
            --notes "Windows x64용 영상 준비 도우미 공개 테스트입니다. Microsoft Store 앱이나 편집 앱이 아닙니다. 설치·HKCU 자동 실행·브라우저 loopback·semantic VOD 준비·제거를 Windows에서 확인했지만 코드 서명되지 않은 미리보기라 SmartScreen 경고가 표시될 수 있습니다. SHA-256 파일, 대응 소스 안내와 GitHub build-provenance attestation을 함께 확인할 수 있습니다."
          draft_created=1
          published=0
          rollback() {
            status=$?
            if [ "$published" -eq 0 ] && [ "$draft_created" -eq 1 ]; then
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes >/dev/null 2>&1 || true
            fi
            exit "$status"
          }
          trap rollback ERR
          gh release upload "$tag" dist/windows-preview/* --repo "$GITHUB_REPOSITORY"
          printf '%s\n' 'Windows preview assets uploaded; waiting for GitHub SHA-256 digest readback.'
          local_asset_count="$(find dist/windows-preview -maxdepth 1 -type f | wc -l | tr -d ' ')"
          digest_ready=0
          for attempt in $(seq 1 24); do
            release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
              | jq -c --arg tag "$tag" '[.[] | select(.tag_name == $tag)] as $matches | if ($matches|length)==1 then $matches[0] else error("expected one exact draft release") end')"
            remote_digest_count="$(jq '[.assets[] | select(
              (.digest | type) == "string"
              and (.digest | startswith("sha256:"))
            )] | length' <<<"$release_json")"
            if [ "$remote_digest_count" = "$local_asset_count" ]; then
              digest_ready=1
              break
            fi
            printf 'GitHub asset digest readback pending (%s/24).\n' "$attempt"
            sleep 5
          done
          if [ "$digest_ready" -ne 1 ]; then
            echo 'GitHub did not expose every asset digest before the readback deadline.' >&2
            exit 1
          fi
          test "$(jq -r '.draft' <<<"$release_json")" = true
          test "$(jq -r '.prerelease' <<<"$release_json")" = true
          mapfile -t remote_assets < <(jq -r '.assets[].name' <<<"$release_json" | sort)
          mapfile -t local_assets < <(find dist/windows-preview -maxdepth 1 -type f -printf '%f\n' | sort)
          test "${remote_assets[*]}" = "${local_assets[*]}"
          for file in "${local_assets[@]}"; do
            local_size="$(stat -c '%s' -- "dist/windows-preview/$file")"
            local_sha="$(sha256sum -- "dist/windows-preview/$file" | cut -d' ' -f1)"
            test "$(jq -r --arg file "$file" '.assets[] | select(.name == $file) | .size' <<<"$release_json")" = "$local_size"
            test "$(jq -r --arg file "$file" '.assets[] | select(.name == $file) | .digest' <<<"$release_json")" = "sha256:$local_sha"
          done
          readback="$RUNNER_TEMP/kirinuki-windows-preview-readback"
          mkdir -m 700 -- "$readback"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir "$readback"
          npm run test:package:desktop:windows-preview -- "$readback"
          powershell.exe -NoLogo -NoProfile -NonInteractive -Command \
            '$signature=Get-AuthenticodeSignature -LiteralPath (Join-Path $env:RUNNER_TEMP "kirinuki-windows-preview-readback/Kirinuki-Engine-windows-x64-preview-setup.exe"); if($signature.Status.ToString() -cne "NotSigned"){throw "remote installer signature state changed"}'
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
          published=1
          release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag")"
          test "$(jq -r '.draft' <<<"$release_json")" = false
          test "$(jq -r '.prerelease' <<<"$release_json")" = true
          test "$(jq -r '.tag_name' <<<"$release_json")" = "$tag"
          trap - ERR
