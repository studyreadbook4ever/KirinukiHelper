name: Kirinuki app quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: typescript-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.17.0"
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Run the fail-closed TypeScript quality gate
        run: npm run check

      - name: Prove generated app artifacts are current
        run: |
          git diff --check -- web
          git diff --exit-code -- web

  web-browser-e2e:
    name: Kirinuki app browser E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.17.0"
          cache: npm

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Prepare the pinned FFmpeg used by the browser smoke
        run: npm run tools:desktop -- linux-x64

      - name: Install Chrome for Testing and matching ChromeDriver
        id: setup-chrome
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Build, test, and verify the complete release artifacts
        run: npm run package
        env:
          CHROMIUM_BINARY: ${{ steps.setup-chrome.outputs.chrome-path }}
          CHROMEDRIVER_BINARY: ${{ steps.setup-chrome.outputs.chromedriver-path }}
          FFMPEG_BINARY: ${{ github.workspace }}/.artifacts/desktop-tools/linux-x64/ffmpeg

      - name: Prove release packaging kept tracked sources clean
        run: |
          git diff --check
          git diff --exit-code

      - name: Preserve the verified web release for deployment
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: verified-web-release-${{ github.sha }}
          path: |
            dist/kirinuki-web-v*.zip
            dist/kirinuki-web-v*.zip.sha256
            dist/kirinuki-release-v*.json
            dist/kirinuki-release-v*.json.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  native-desktop:
    name: Native desktop · ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: windows-2025
            target: win32-x64
          - runner: macos-15
            target: darwin-arm64
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.17.0"
          cache: npm

      - name: Verify the native package target
        env:
          EXPECTED_DESKTOP_TARGET: ${{ matrix.target }}
        run: >-
          node -e "const actual=process.platform+'-'+process.arch;
          if(actual!==process.env.EXPECTED_DESKTOP_TARGET)
          throw new Error('expected '+process.env.EXPECTED_DESKTOP_TARGET+', got '+actual)"

      - name: Install locked dependencies without lifecycle scripts
        run: npm ci --ignore-scripts

      - name: Materialize the pinned checksum-verified Electron test runtime
        run: node node_modules/electron/install.js

      - name: Install the Linux sandbox helper for the pinned Electron test runtime
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sandbox_path="node_modules/electron/dist/chrome-sandbox"
          test -f "$sandbox_path"
          test ! -L "$sandbox_path"
          sudo chown root:root -- "$sandbox_path"
          sudo chmod 4755 -- "$sandbox_path"
          test "$(stat -c '%u:%g:%a' -- "$sandbox_path")" = "0:0:4755"

      - name: Install matching Chrome and ChromeDriver for the installed-engine browser proof
        id: setup-native-chrome
        uses: browser-actions/setup-chrome@2e1d749697dd1612b833dba4a722266286fbefcd # v2
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Typecheck the complete cross-platform source
        run: npm run typecheck && npm run desktop:icons:check

      - name: Run the complete unit test suite natively
        run: npm test

      - name: Build the unsigned prepackaged app and native installer
        run: npm run package:desktop:installer

      - name: Prove Windows Job Object lifetime and descendant cleanup natively
        if: runner.os == 'Windows'
        run: npm run test:windows:job-launcher

      - name: Install the Linux sandbox helper in the unsigned package copy
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sandbox_path="dist/desktop/${{ matrix.target }}/Kirinuki-${{ matrix.target }}/chrome-sandbox"
          test -f "$sandbox_path"
          test ! -L "$sandbox_path"
          sudo chown root:root -- "$sandbox_path"
          sudo chmod 4755 -- "$sandbox_path"
          test "$(stat -c '%u:%g:%a' -- "$sandbox_path")" = "0:0:4755"

      - name: Run the packaged desktop liveness smoke on Linux
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:package:desktop

      - name: Run the packaged desktop liveness smoke natively
        if: runner.os != 'Linux'
        run: npm run test:package:desktop

      - name: Prove exact health, document capability, three-platform fixture materialization, and Range media
        run: npm run test:semantic:engine

      - name: Install and read back exact Linux deb runtime dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 6
        shell: bash
        run: |
          set -euo pipefail
          apt_directory="$(mktemp -d /tmp/kirinuki-apt.XXXXXX)"
          trap 'sudo rm -rf -- "$apt_directory"' EXIT
          chmod 755 "$apt_directory"
          mkdir "$apt_directory/sourceparts" "$apt_directory/lists"
          # Keep Ubuntu suites, components, and signing keys; bypass the failing Azure mirror.
          python3 - /etc/apt/sources.list.d/ubuntu.sources "$apt_directory/ubuntu.sources" <<'PYTHON'
          import pathlib, re, sys
          source = pathlib.Path(sys.argv[1]).read_text()
          mirror = "mirror+file:/etc/apt/apt-mirrors.txt"
          parts = re.split(r"(\n[ \t]*\n)", source)
          for index, part in enumerate(parts):
              if not any(line.strip() and not line.lstrip().startswith("#") for line in part.splitlines()):
                  continue
              uri = re.search(r"(?m)^URIs:[ \t]*(\S+)[ \t]*$", part)
              if uri is None or len(re.findall(r"(?m)^URIs:", part)) != 1 or re.search(r"(?m)^URIs:[^\n]*\n[ \t]+\S", part):
                  raise SystemExit("Ubuntu source requires one single-line URI")
              if uri.group(1) != mirror:
                  if not re.fullmatch(r"https?://(?:archive|security)\.ubuntu\.com/ubuntu/?", uri.group(1)):
                      raise SystemExit("Ubuntu source contains an unsupported URI")
                  continue
              suites = re.search(r"(?m)^Suites:[ \t]*(.+)$", part)
              if suites is None:
                  raise SystemExit("Ubuntu mirror source has no Suites")
              security = [suite.endswith("-security") for suite in suites.group(1).split()]
              if not security or (any(security) and not all(security)):
                  raise SystemExit("Ubuntu mirror source has unsupported mixed Suites")
              host = "security.ubuntu.com" if all(security) else "archive.ubuntu.com"
              start, end = uri.span(1)
              parts[index] = part[:start] + "https://" + host + "/ubuntu/" + part[end:]
          result = "".join(parts)
          if "mirror+file:" in result:
              raise SystemExit("Ubuntu source contains an unsupported mirror URI")
          pathlib.Path(sys.argv[2]).write_text(result)
          PYTHON
          apt_options=(
            -o "Dir::Etc::sourcelist=$apt_directory/ubuntu.sources"
            -o "Dir::Etc::sourceparts=$apt_directory/sourceparts"
            -o "Dir::State::lists=$apt_directory/lists"
            -o Acquire::Retries=1
            -o Acquire::http::Timeout=20
            -o Acquire::https::Timeout=20
            -o APT::Update::Error-Mode=any
          )
          # Log presence only: proxy URLs may contain credentials.
          for proxy_name in http_proxy HTTP_PROXY https_proxy HTTPS_PROXY no_proxy NO_PROXY all_proxy ALL_PROXY; do
            if [[ -v "$proxy_name" ]]; then
              printf 'proxy %s present=true\n' "$proxy_name"
            else
              printf 'proxy %s present=false\n' "$proxy_name"
            fi
          done
          # APT reads lowercase proxy variables; preserve an explicitly set lowercase value.
          for proxy_name in http_proxy https_proxy no_proxy; do
            uppercase_proxy_name="${proxy_name^^}"
            if [[ ! -v "$proxy_name" && -v "$uppercase_proxy_name" ]]; then
              export "$proxy_name=${!uppercase_proxy_name}"
            fi
          done
          for probe_host in archive.ubuntu.com security.ubuntu.com; do
            for probe_user in runner root _apt; do
              if [[ "$probe_user" == runner ]]; then
                probe_command=(getent ahostsv4 "$probe_host")
              else
                probe_command=(sudo -u "$probe_user" -- getent ahostsv4 "$probe_host")
              fi
              if timeout 8s "${probe_command[@]}" >/dev/null 2>&1; then
                probe_status=0
              else
                probe_status=$?
              fi
              printf 'dns host=%s user=%s exit=%s\n' "$probe_host" "$probe_user" "$probe_status"
            done
            probe_suite=noble
            if [[ "$probe_host" == security.ubuntu.com ]]; then probe_suite=noble-security; fi
            for proxy_mode in default direct; do
              probe_options=()
              if [[ "$proxy_mode" == direct ]]; then probe_options=(--noproxy '*'); fi
              if curl --disable --head --fail --silent --connect-timeout 5 --max-time 10 \
                "${probe_options[@]}" "https://$probe_host/ubuntu/dists/$probe_suite/InRelease" \
                >/dev/null 2>&1; then
                probe_status=0
              else
                probe_status=$?
              fi
              printf 'https host=%s proxy=%s exit=%s\n' "$probe_host" "$proxy_mode" "$probe_status"
            done
          done
          sudo --preserve-env=http_proxy,https_proxy,no_proxy apt-get update "${apt_options[@]}"
          sudo --preserve-env=http_proxy,https_proxy,no_proxy apt-get install --yes --no-install-recommends libnotify4 libsecret-1-0 "${apt_options[@]}"
          for dependency in libnotify4 libsecret-1-0; do
            test "$(dpkg-query --show --showformat='${Status}' "$dependency")" = "install ok installed"
          done

      - name: Run the exact Linux installer smoke under an isolated display
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:package:desktop:installer
        env:
          CHROMIUM_BINARY: ${{ steps.setup-native-chrome.outputs.chrome-path }}
          CHROMEDRIVER_BINARY: ${{ steps.setup-native-chrome.outputs.chromedriver-path }}
          KIRINUKI_INSTALLED_BROWSER_SMOKE: "1"
          KIRINUKI_INSTALLER_SYSTEM_SMOKE: "1"

      - name: Run the exact native OS-specific installer or package smoke
        if: runner.os != 'Linux'
        run: npm run test:package:desktop:installer
        env:
          CHROMIUM_BINARY: ${{ steps.setup-native-chrome.outputs.chrome-path }}
          CHROMEDRIVER_BINARY: ${{ steps.setup-native-chrome.outputs.chromedriver-path }}
          KIRINUKI_INSTALLED_BROWSER_SMOKE: "1"
          KIRINUKI_INSTALLER_SYSTEM_SMOKE: "1"

      - name: Prove native packaging kept tracked sources clean
        run: |
          git diff --check
          git diff --exit-code -- web

      - name: Upload only the unsigned lifecycle manifest (never the installer binary)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-test-evidence-${{ matrix.target }}-${{ github.sha }}
          path: dist/installers/${{ matrix.target }}/UNSIGNED-TEST-ONLY-installer-manifest.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

      # The public Actions artifact contains JSON evidence only. Installer bytes
      # remain runner-local and are destroyed with the job; this workflow has
      # contents:read and cannot create a GitHub Release.
